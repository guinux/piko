[workspace]
resolver = "3"
members = [
    "crates/piko-db",
    "crates/piko-db-write",
    "crates/piko-net",
    "crates/piko-sig",
    "crates/piko-sig-write",
    "crates/piko-txn",
    "crates/piko",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/nuxgui/piko"
authors = ["piko contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.rustdoc]
# A doc link is API documentation. A dead one points at an item that no longer exists, and a
# private one renders as nothing for the reader of the public docs. Both are wrong answers,
# not cosmetic slips. Denying them keeps `cargo doc --workspace --no-deps` a commit gate.
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
# Sizes and counts read off disk are attacker-influenced; silent wrapping is a bug.
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# An exception to a lint is `#[expect(..., reason = "...")]`, never `#[allow]`: an expectation
# that no longer suppresses anything is reported, so a stale exception cannot outlive its cause.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
alpm-types = "0.11"
# The same library libalpm itself verifies with.
gpgme = "0.11"
# Dev-dependencies only: the oracles of the differential tests of piko's own readers.
alpm-db = "0.2"
alpm-pkginfo = "0.6"
alpm-repo-db = "0.1"
# Dev-dependency only: the property tests of piko's metadata readers.
proptest = "1"
# We would only need `default-features = false` here because the default `creation` feature is
# only needed to *write* mtree files, piko only reads them.
# But  it does not build, because of an upstream bug.
alpm-mtree = "0.3"
alpm-common = "0.2"
# The zstd decoder for `piko_db::compression`, the one decoder every archive goes through.
# Without the default features: `legacy` decodes the pre-1.0 frame formats, which no package
# or database uses, and the other two are for compressing.
zstd = { version = "0.13", default-features = false }
flate2 = "1"
glob = "0.3"
# `openat`-based path resolution for extraction, and the open flags (`O_NOFOLLOW`, `O_NONBLOCK`)
# every audited open passes. `unsafe_code = "forbid"` rules out calling `libc::openat` directly.
# `process` is for `chroot` and `umask`. See `piko_txn::exec`.
rustix = { version = "1.1", default-features = false, features = ["fs", "process"] }
# The download sandbox's two kernel restrictions. See `piko_net::sandbox`.
landlock = "0.4"
# The same C library libalpm filters system calls with, so a name resolves to the same number on
# every architecture.
libseccomp = "0.4"
tar = "0.4"
# The `%SHA256SUM%` of a package file, hashed as the file streams. `alpm-types` already depends on
# it, and its own `Checksum::calculate_from` takes the whole input as one slice.
sha2 = "0.10"
# Decodes `%PGPSIG%`. The version `alpm-types` checks that field with.
base64 = "0.22"
thiserror = "2"
# rustls + platform-verifier: keeps piko's TLS stack pure Rust while still validating
# against the system CA store, same as libcurl/pacman.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# `local-offset` is what lets a timestamp be rendered in the machine's own time zone, the
# way `pacman.log` spells one. The feature is gated because the offset can only be read
# soundly while the process is single-threaded — see `piko_txn::history::LocalOffset`.
time = { version = "0.3", features = ["local-offset"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# CLI-only progress bar/spinner for downloads and transaction steps
indicatif = "0.18"
# CLI-only signal handling: Ctrl+C, a hangup and a terminate request stop a download or a
# commit at a step boundary. It tells the three apart, which `ctrlc` cannot.
signal-hook = "0.4"
# CLI-only ANSI styling for the transaction progress display.
console = "0.16"

piko-db = { path = "crates/piko-db", version = "0.1.0" }
piko-db-write = { path = "crates/piko-db-write", version = "0.1.0" }
piko-net = { path = "crates/piko-net", version = "0.1.0" }
piko-sig = { path = "crates/piko-sig", version = "0.1.0" }
piko-sig-write = { path = "crates/piko-sig-write", version = "0.1.0" }
piko-txn = { path = "crates/piko-txn", version = "0.1.0" }

[profile.release]
# A package manager runs as root; keep overflow checks on in release builds.
overflow-checks = true
codegen-units = 1
lto = "fat"

# The solver is the one piece of this workspace whose test cost is dominated by how fast the
# code runs. `plan_real_system` solves real removal cascades : a `-Rc` of a package can be
# one 17-second call unoptimized. Optimizing this crate alone takes that test from 225 s to
# 33 s, with the same sample and the same assertions.
# `debug-assertions` stays on, and with it `overflow-checks`.
[profile.dev.package.piko-db]
opt-level = 2
