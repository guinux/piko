[package]
name = "piko"
version = "0.1.0"
description = "A simple, secure ALPM package manager"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
alpm-mtree.workspace = true
alpm-types.workspace = true
clap.workspace = true
console.workspace = true
ctrlc.workspace = true
indicatif.workspace = true
piko-db.workspace = true
piko-db-write.workspace = true
piko-net.workspace = true
piko-sig.workspace = true
piko-sig-write.workspace = true
piko-txn.workspace = true
# The CLI has failure modes no library crate has a type for — an unreadable `pacman.conf`,
# a mistyped repository name, a rejected repository signature.
# A merge writes the base and the merged result into a private scratch directory. Writing a
# correct `mkdtemp` by hand, in a process that may be root, is not worth the saving.
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
# `tests/key.rs` builds its throwaway keyrings through GPGME directly.
gpgme.workspace = true
# Scriptlet and hook execution can only be exercised where the `piko` binary exists, because
# that binary *is* the exec helper — see `tests/side_effects.rs`.
rustix.workspace = true
tar.workspace = true
# `install` resolves package names through a repository database, so the same test binary
# needs a way to build one — see `piko-db/src/fixture.rs`.
piko-db = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
