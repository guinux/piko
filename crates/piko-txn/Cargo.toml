[package]
name = "piko-txn"
version.workspace = true
description = "Commit engine for piko"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alpm-types.workspace = true
# `%PGPSIG%`, which a repository database spells in base64.
base64.workspace = true
piko-db.workspace = true
piko-db-write.workspace = true
# The message of each error, for a frontend that renders it in the language of its user.
piko-i18n.workspace = true
piko-net.workspace = true
piko-sig.workspace = true
rustix.workspace = true
# The `%SHA256SUM%` check. See `transaction::published`.
sha2.workspace = true
tar.workspace = true
# The private staging directory `FileSource` copies a named package file into: mode `0700`,
# a random name, and removal on drop.
tempfile.workspace = true
thiserror.workspace = true
# Timestamps for `pacman.log` and the transaction history. Formatting is done by hand;
# only the calendar arithmetic comes from here.
time.workspace = true
# The local time zone's rules, for the UTC offset at each instant.
jiff.workspace = true

[dev-dependencies]
# The parser piko's own `.PKGINFO` reader replaces. Only `pkginfo_real_system.rs` reads it, as
# an oracle.
alpm-pkginfo.workspace = true
proptest.workspace = true
# The local-database side of conflict detection needs a database to ask, and `DbFixture`
# builds throwaway ones. Tests use fixtures in a tempdir, never real system paths.
piko-db = { workspace = true, features = ["fixture"] }
# The tests render each error through the catalog.
piko-i18n = { workspace = true, features = ["catalog"] }
