[package]
name = "piko-db"
version = "0.1.0"
description = "Reader for the alpm-db local package database"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# docs.rs builds with `fixture` on, so the module the feature gates is documented rather than
# missing, and with `--cfg docsrs` so each gated item carries its feature badge.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Exposes the test-fixture builder to downstream crates and integration tests.
fixture = ["dep:tempfile"]

[dependencies]
alpm-common.workspace = true
alpm-mtree.workspace = true
alpm-types.workspace = true
# Required: piko inflates `mtree` itself, against a bound, rather than letting
# `alpm-mtree` do it unbounded internally.
flate2.workspace = true
tar.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
# The zstd half of `compression`; flate2 above is the gzip half.
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
# `openat`, so a read inside a database entry follows no symbolic link at any level, and the
# `O_NOFOLLOW | O_NONBLOCK` flags of every other open.
# `unsafe_code = "forbid"` rules out calling `libc::openat` directly.
rustix.workspace = true

[dev-dependencies]
# The parsers piko's own `desc` and `files` readers replace. Only the real-system differential
# tests read them, as an oracle.
alpm-db.workspace = true
alpm-repo-db.workspace = true
flate2.workspace = true
proptest.workspace = true
tempfile.workspace = true
libdeflater = "1"
# Self dev-dependency so integration tests get the fixture builder without `fixture`
# becoming a default feature (which would pull tempfile into production builds).
piko-db = { path = ".", features = ["fixture"] }

[lints]
workspace = true
