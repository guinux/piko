[package]
name = "piko-db-write"
version.workspace = true
description = "Writer for the alpm-db local package database: the db.lck lock and atomic entry writes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alpm-types.workspace = true
piko-db.workspace = true
# The message of each error, for a frontend that renders it in the language of its user.
piko-i18n.workspace = true
# `O_NOFOLLOW` on the atomic write's temporary file; see `local::create_temp`.
rustix.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The tests render each error through the catalog.
piko-i18n = { workspace = true, features = ["catalog"] }
proptest.workspace = true
tempfile.workspace = true
