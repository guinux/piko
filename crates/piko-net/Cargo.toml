[package]
name = "piko-net"
version = "0.1.0"
description = "Downloading and refreshing repository databases"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The sandbox tests start their own binary as the download helper, so they need their own `main`.
[[test]]
name = "sandbox"
harness = false

[dependencies]
# `PackageFileName`, for naming a package download.
alpm-types.workspace = true
piko-db.workspace = true
piko-db-write.workspace = true
piko-sig.workspace = true
thiserror.workspace = true
# The calendar arithmetic of an HTTP date.
time.workspace = true
landlock.workspace = true
libseccomp.workspace = true
nix = { version = "0.31", default-features = false, features = ["user"] }
rustix = { workspace = true, features = ["process", "thread"] }
ureq.workspace = true

[dev-dependencies]
# A refresh dates what it downloads by reading it as a repository archive, so a test mirror has
# to serve a real one — see `piko-db/src/fixture.rs`.
piko-db = { workspace = true, features = ["fixture"] }
tempfile.workspace = true
